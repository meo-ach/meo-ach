<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15111f"/>
      <stop offset="45%" stop-color="#2a1d3d"/>
      <stop offset="100%" stop-color="#3d2354"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9ed8"/>
      <stop offset="50%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#bd93f9"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="star">
      <path d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z" fill="#ffe3f5"/>
    </g>
    <g id="bow">
      <path d="M0 0 C -10 -9, -22 -6, -20 2 C -18 9, -8 6, 0 0 Z" fill="#ff9ed8" opacity="0.9"/>
      <path d="M0 0 C 10 -9, 22 -6, 20 2 C 18 9, 8 6, 0 0 Z" fill="#ff79c6" opacity="0.9"/>
      <circle cx="0" cy="0" r="2.6" fill="#fff0f8"/>
    </g>
    <g id="paw">
      <ellipse cx="0" cy="4" rx="6" ry="5" fill="#e6c9ff" opacity="0.85"/>
      <ellipse cx="-6.5" cy="-3" rx="2.6" ry="3.2" fill="#e6c9ff" opacity="0.85"/>
      <ellipse cx="-2.2" cy="-6.5" rx="2.6" ry="3.2" fill="#e6c9ff" opacity="0.85"/>
      <ellipse cx="2.2" cy="-6.5" rx="2.6" ry="3.2" fill="#e6c9ff" opacity="0.85"/>
      <ellipse cx="6.5" cy="-3" rx="2.6" ry="3.2" fill="#e6c9ff" opacity="0.85"/>
    </g>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- corner bows -->
  <g transform="translate(46,42) scale(1.1)">
    <use href="#bow"/>
    <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="4.5s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(854,178) scale(1.1) rotate(180)">
    <use href="#bow"/>
    <animateTransform attributeName="transform" type="rotate" values="174 0 0;186 0 0;174 0 0" dur="4.5s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- floating stars -->
  <g>
    <use href="#star" x="90" y="30"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></use>
    <use href="#star" x="160" y="170" transform="scale(0.7)"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></use>
    <use href="#star" x="740" y="40" transform="scale(0.8)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></use>
    <use href="#star" x="800" y="130"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></use>
    <use href="#star" x="450" y="24" transform="scale(0.6)"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></use>
    <use href="#star" x="600" y="190" transform="scale(0.65)"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></use>
    <use href="#star" x="300" y="185" transform="scale(0.55)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></use>
    <use href="#star" x="230" y="35" transform="scale(0.75)"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></use>

    <!-- drifting stars -->
    <g>
      <use href="#star" x="500" y="60" transform="scale(0.5)" opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 10; 0 0" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#star" x="120" y="100" transform="scale(0.45)" opacity="0.6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -20 15; 0 0" dur="5.2s" repeatCount="indefinite"/>
    </g>

    <!-- paw print trail -->
    <g transform="translate(190,60) rotate(-18) scale(0.8)" opacity="0.7">
      <use href="#paw"/>
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(225,85) rotate(-14) scale(0.95)" opacity="0.85">
      <use href="#paw"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(655,145) rotate(160) scale(0.85)" opacity="0.7">
      <use href="#paw"/>
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(688,118) rotate(164) scale(0.7)" opacity="0.6">
      <use href="#paw"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- title -->
  <text x="450" y="108" text-anchor="middle" font-family="Quicksand, Verdana, sans-serif" font-weight="700" font-size="46" fill="url(#titleGrad)" filter="url(#softGlow)">
    Nidhi Naik
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="146" text-anchor="middle" font-family="Quicksand, Verdana, sans-serif" font-weight="500" font-size="19" fill="#e6c9ff" letter-spacing="0.5">
    Edge AI &amp; Hardware Enthusiast
  </text>

  <text x="450" y="176" text-anchor="middle" font-family="Quicksand, Verdana, sans-serif" font-weight="400" font-size="14" fill="#c9a6e0">
    ˚₊‧꒰ა curious mind • creative soul • always building ໒꒱‧₊˚
  </text>
</svg>
