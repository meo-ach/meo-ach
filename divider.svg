<svg width="900" height="40" viewBox="0 0 900 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15111f" stop-opacity="0"/>
      <stop offset="18%" stop-color="#bd93f9" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ff79c6" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#bd93f9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#15111f" stop-opacity="0"/>
    </linearGradient>
    <g id="dstar">
      <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z" fill="#ffd6ec"/>
    </g>
    <g id="dbow">
      <path d="M0 0 C -7 -6, -15 -4, -14 1.5 C -13 6, -6 4, 0 0 Z" fill="#ff9ed8"/>
      <path d="M0 0 C 7 -6, 15 -4, 14 1.5 C 13 6, 6 4, 0 0 Z" fill="#ff79c6"/>
      <circle cx="0" cy="0" r="1.8" fill="#fff0f8"/>
    </g>
    <g id="dpaw">
      <ellipse cx="0" cy="3" rx="4" ry="3.3" fill="#e6c9ff"/>
      <ellipse cx="-4.3" cy="-2" rx="1.7" ry="2.1" fill="#e6c9ff"/>
      <ellipse cx="-1.4" cy="-4.3" rx="1.7" ry="2.1" fill="#e6c9ff"/>
      <ellipse cx="1.4" cy="-4.3" rx="1.7" ry="2.1" fill="#e6c9ff"/>
      <ellipse cx="4.3" cy="-2" rx="1.7" ry="2.1" fill="#e6c9ff"/>
    </g>
  </defs>

  <line x1="0" y1="20" x2="900" y2="20" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <g transform="translate(450,20)">
    <use href="#dbow"/>
    <animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" dur="4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <use href="#dstar" x="330" y="20"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></use>
  <use href="#dstar" x="570" y="20"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></use>
  <use href="#dstar" x="250" y="20" transform="scale(0.7)"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/></use>
  <use href="#dstar" x="650" y="20" transform="scale(0.7)"><animate attributeName="opacity" values="1;0.4;1" dur="2.1s" repeatCount="indefinite"/></use>

  <g transform="translate(180,20) rotate(-20)" opacity="0.6">
    <use href="#dpaw"/>
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(720,20) rotate(160)" opacity="0.6">
    <use href="#dpaw"/>
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.2s" repeatCount="indefinite"/>
  </g>
</svg>
